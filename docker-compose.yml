services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    volumes:
      - smartdigest-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      SMARTDIGEST_REDIS_URL: redis://redis:6379/0
      SMARTDIGEST_ENV: ${SMARTDIGEST_ENV:-development}
      SMARTDIGEST_TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - smartdigest-data:/app/.smartdigest-data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    environment:
      SMARTDIGEST_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    environment:
      SMARTDIGEST_DOMAIN: ${SMARTDIGEST_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  smartdigest-data:
  smartdigest-redis:
  caddy-data:
  caddy-config:
